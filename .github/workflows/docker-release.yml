name: Docker Release

on:
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: ecs-service-connect-agent

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine semantic image tag
        id: semver
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "${LATEST_TAG}" ]; then
            NEXT_TAG="v0.1.0"
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
            if ! [[ "${MAJOR}" =~ ^[0-9]+$ && "${MINOR}" =~ ^[0-9]+$ && "${PATCH}" =~ ^[0-9]+$ ]]; then
              echo "Latest tag is not a valid semantic version: ${LATEST_TAG}"
              exit 1
            fi
            NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "image_tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using image tag: ${NEXT_TAG}"

      - name: Build agent binary
        shell: bash
        run: |
          set -euo pipefail
          cd agent
          ./docker-build.sh go-build

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${{ steps.semver.outputs.image_tag }}"
          docker build -f agent/Dockerfile.build -t "${IMAGE_URI}" agent
          docker push "${IMAGE_URI}"
          echo "Published ${IMAGE_URI}"
